<!DOCTYPE html>
<html lang="en">

<head>
    <title>Question 4</title>
</head>

<body>

    <h1>
        There are
        <x-days-to-newyears></x-days-to-newyears>
        day(s) left until the new year in the Gregorian calendar.
    </h1>

    <script>

        class DaysToNewYears extends HTMLElement {

            connectedCallback() {

                let today = new Date();

                let nNewYearsEve = new Date(today.getFullYear(), 11, 31);

                let nSeconds = 1000 * 60 * 60 * 24;

                let nDaysLeft = Math.ceil(
                    (nNewYearsEve.getTime() - today.getTime()) / (nSeconds)
                );

                console.log(nDaysLeft);

                this.innerHTML = nDaysLeft;

            }

        }

        customElements.define("x-days-to-newyears", DaysToNewYears);

    </script>

</body>
</html>
